<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>画图参考图</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="titles">
        <h1>画图参考图</h1>
        <p id="subtitle">正在读取…</p>
      </div>
      <div class="topbar-actions">
        <button id="refresh" class="ghost">刷新</button>
      </div>
    </header>

    <p id="banner" class="banner hidden" role="status"></p>

    <section id="slots" class="slots" aria-label="参考图"></section>

    <section class="card">
      <div class="card-head">
        <h2>插件当前状态</h2>
        <span id="infoMsg" class="msg">正在读取…</span>
      </div>
      <div id="infoGrid" class="info-grid"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>试画一张</h2>
        <span class="msg">用当前配置直接调一次画图接口，和群里调用走的是同一条路。</span>
      </div>
      <div class="test-row">
        <input id="testPrompt" type="text" placeholder="比如：一只戴着耳机的橘猫，赛博朋克霓虹风" />
        <select id="testRatio" aria-label="宽高比">
          <option value="auto">auto（交给接口）</option>
          <option value="1:1">1:1 方图</option>
          <option value="16:9">16:9 横屏</option>
          <option value="9:16">9:16 竖屏</option>
          <option value="4:3">4:3 横向</option>
          <option value="3:4">3:4 竖向</option>
        </select>
        <button id="testRun" class="primary">试画</button>
      </div>
      <p id="testMsg" class="msg"></p>
      <div id="testOut" class="test-out"></div>
    </section>

    <footer class="foot">
      <p>
        这两张图只是「参考」。想让 bot 在群里临时换画风，让它自己用
        <code>set_drawing_reference</code> 工具记，那套是临时的、不写进配置。
      </p>
    </footer>
  </main>
  <!-- 兜底守卫：普通内联脚本，一定比任何外部脚本先跑。
       如果 app.js 因为任何原因整个没执行（模块求值出错、资源 404、被 CSP 拦），
       页面上原本只会永远显示「正在读取…」，用户完全看不出发生了什么。
       这段在 4 秒后把话说清楚。它不依赖任何外部资源，所以几乎不可能也挂掉。 -->
  <script>
    (function () {
      var timer = setTimeout(function () {
        if (window.__artistPageBooted) return;
        var banner = document.getElementById("banner");
        if (banner) {
          banner.className = "banner error";
          banner.textContent =
            "页面脚本没能启动（app.js 未执行）。常见原因：浏览器缓存了旧版本，" +
            "或者面板加载资源时被拦。请硬刷新（Ctrl+F5 / ⌘+Shift+R）后重试；" +
            "仍然不行就看一下浏览器控制台里的红字。";
        }
        var subtitle = document.getElementById("subtitle");
        if (subtitle) subtitle.textContent = "脚本未启动";
      }, 4000);
      window.addEventListener("error", function (event) {
        if (window.__artistPageBooted) return;
        clearTimeout(timer);
        var banner = document.getElementById("banner");
        if (banner) {
          banner.className = "banner error";
          banner.textContent =
            "页面脚本报错：" + (event.message || "未知错误") +
            "（" + (event.filename || "?") + ":" + (event.lineno || 0) + "）";
        }
      });
    })();
  </script>

  <!-- type="module" 不是风格问题，是必需的。

       AstrBot 会把桥接脚本插到「body 结束标签」之前，也就是这个 script 之后；
       普通脚本会立刻执行，于是 app.js 跑的时候 window.AstrBotPluginPage
       还不存在（所有按钮报「桥接层不可用」）。模块脚本天生延迟到文档解析完
       才执行，正好落在桥接脚本之后。

       ⚠️ 这里**绝对不能**写出 body 结束标签的字面量。
       AstrBot 是用字符串替换的方式插入的，会命中**第一个**出现的那个，
       写进注释里就等于把桥接脚本注释掉了 —— 页面照样能打开，但
       window.AstrBotPluginPage 永远不存在，而且一个字都不报。
       tests/test_page_markup.py 里有一条测试专门盯着这件事。 -->
  <script type="module" src="./app.js"></script>
</body>
</html>
